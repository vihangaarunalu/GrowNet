sentence=A self-growing neural network that learns on the microcontroller itself, even an Arduino Nano with 2 KB of RAM.
paragraph=On-device training (no PC, no cloud), sizes itself to each chip's memory, works with any sensor, add sensors later without losing learning, says "I don't know" for unfamiliar input, and saves a portable brain. Add one #include to any sketch and GrowNet Insight explains what it sees; type #train to learn its normal behaviour.
